<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/jpeg" href="./app-logo.jpg" />
    <link rel="apple-touch-icon" href="./app-logo.jpg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SPK" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>SPK - Sistem Penilaian Karyawan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = new URL('./sw.js', window.location.href).toString();

          navigator.serviceWorker.register(swUrl, { scope: './' })
            .then((reg) => {
              console.log('Service Worker registered successfully!', reg.scope);
              reg.update().catch((err) => console.log('SW update check failed:', err));

              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  reg.update().catch((err) => console.log('SW update check failed on focus:', err));
                }
              });

              if (reg.waiting) {
                window.dispatchEvent(new CustomEvent('sw-update-available'));
              }

              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.dispatchEvent(new CustomEvent('sw-update-available'));
                    }
                  };
                }
              };
            })
            .catch((err) => console.log('Service Worker registration failed:', err));

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
